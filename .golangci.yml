version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - misspell
    - unconvert
    - usestdlibvars
  exclusions:
    presets:
      # Unchecked errors from Close and fmt.Fprint* on terminals and HTTP
      # bodies are fine to ignore.
      - std-error-handling

formatters:
  enable:
    - gofmt
